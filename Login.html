<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Smertedagbog</title>

    <link rel="stylesheet" href="design.css">
</head>

<body>

    <div class="kort">

        <!-- Titel -->
        <h1>Smertedagbog</h1>

        <!-- Information -->
        <div class="information">
            <h2>Login</h2>

            <p>
                Log ind for at få adgang til Smertedagbogen.
            </p>
        </div>

        <!-- Loginformular -->
        <form>

            <label for="username">
                Brugernavn:
            </label>

            <input type="text"
                   id="username"
                   name="username"
                   placeholder="Indtast brugernavn"
                   required>

            <label for="pwd">
                Kodeord:
            </label>

            <input type="password"
                   id="pwd"
                   name="pwd"
                   placeholder="Indtast kodeord"
                   required>

            <button type="button"
                    onclick="window.location.href='startside.html'">
                Log ind
            </button>

        </form>

        <!-- Tilbage -->
        <button type="button"
                class="tilbage"
                onclick="window.location.href='index.html'">
            Tilbage til forsiden
        </button>

    </div>

</body>
</html>

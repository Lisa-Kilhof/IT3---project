<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smertedagbog - Login</title>

    <link rel="stylesheet" href="Stylees.css">

    <script src="scriptt.js" defer></script>
</head>

<body>

    <main class="login-container">

        <h1>Smertedagbog</h1>

        <section class="login-card">

            <h2>Log ind</h2>

            <label for="brugerID">Bruger-ID</label>
            <input
                type="text"
                id="brugerID"
                placeholder="Indtast dit bruger-ID"
            >

            <label for="adgangskode">Adgangskode</label>
            <input
                type="password"
                id="adgangskode"
                placeholder="Indtast din adgangskode"
            >

            <button type="button" onclick="logInd()">
                Log ind
            </button>

        </section>

    </main>

</body>
</html>

<!DOCTYPE html>
<html lang="da">

<head>
    <!-- Angiver tegnsættet, så danske bogstaver vises korrekt. -->
    <meta charset="UTF-8">

    <!-- Sørger for, at siden tilpasser sig skærmens bredde. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Angiver titlen, der vises i browserens fane. -->
    <title>Smertedagbog - Patientliste</title>

    <!-- Indlæser CSS-filen, der bestemmer sidens udseende. -->
    <link rel="stylesheet" href="styles.css">

    <!-- Indlæser funktioner til adgangskontrol og patientlisten. -->
    <script src="adgangskontrol.js" defer></script>
    <script src="patientliste.js" defer></script>
</head>

<!-- Kontrollerer, at brugeren er logget ind som sundhedspersonale,
     før patientlisten vises. Funktionen findes i adgangskontrol.js. -->
<body onload="tjekPersonaleLogin()">

    <!-- Hovedområdet indeholder patientlisten. -->
    <main>

        <!-- Samler overskrift og introduktion til siden. -->
        <header>
            <h1>Patientliste</h1>

            <!-- Forklarer, hvad sundhedspersonalet kan gøre på siden. -->
            <p>Vælg en patient for at se vedkommendes smerteregistreringer.</p>
        </header>

        <!-- Viser de patienter, som sundhedspersonalet kan vælge imellem. -->
        <section class="patientliste">

            <!-- PATIENT 1 -->

            <!-- Hvert patientkort viser patientens navn og ID.
                 Knappen sender patientens navn til funktionen
                 visRegistreringer() i patientliste.js. -->
            <article class="patientkort">

                <h2>Anna Jensen</h2>

                <!-- Patientens ID bruges til at finde registreringerne. -->
                <p>Patient-ID: 01</p>

                <!-- Åbner siden med Annas smerteregistreringer. -->
                <button
                    type="button"
                    onclick="visRegistreringer('Anna Jensen')"
                >
                    Se registreringer
                </button>

            </article>


            <!-- PATIENT 2 -->

            <!-- Dette kort fungerer på samme måde som det første,
                 men viser oplysningerne for en anden patient. -->
            <article class="patientkort">

                <h2>Mads Hansen</h2>

                <!-- Patientens ID bruges til at finde registreringerne. -->
                <p>Patient-ID: 02</p>

                <!-- Åbner siden med Mads' smerteregistreringer. -->
                <button
                    type="button"
                    onclick="visRegistreringer('Mads Hansen')"
                >
                    Se registreringer
                </button>

            </article>

        </section>

        <!-- Log ud-knappen bruger funktionen logUd() fra adgangskontrol.js
             til at rydde loginoplysningerne og sende brugeren tilbage. -->
        <button
            type="button"
            class="sekundaer-knap"
            onclick="logUd()"
        >
            Log ud
        </button>

    </main>

</body>
</html>
